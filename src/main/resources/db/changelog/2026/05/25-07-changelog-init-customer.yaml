databaseChangeLog:
  - changeSet:
      id: 1779719221628-1
      author: Irina.Lovtsova
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_customers
                  name: customer_id
                  type: BIGINT
              - column:
                  name: full_name
                  type: VARCHAR
              - column:
                  name: email
                  type: VARCHAR
              - column:
                  name: city
                  type: VARCHAR
            tableName: customers

