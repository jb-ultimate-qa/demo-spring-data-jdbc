databaseChangeLog:
  - changeSet:
      id: 1779719099771-1
      author: Irina.Lovtsova
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users
                  name: id
                  type: BIGINT
              - column:
                  name: username
                  type: VARCHAR
              - column:
                  name: city
                  type: VARCHAR
              - column:
                  name: street
                  type: VARCHAR
              - column:
                  name: passport_number
                  type: VARCHAR
              - column:
                  name: passport_is_valid
                  type: BOOLEAN
            tableName: users

